<body>
    <!-- 🔑 PANEL AUTORYZACJI ADMINA (NA GÓRZE STRONY) -->
    <div id="loginContainer" style="padding: 10px; border-bottom: 2px solid #ddd; background: #fff; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
        <span style="font-weight: bold; font-family: sans-serif;">🔒 Panel Administratora (Zapis/Edycja):</span>
        <form id="loginForm" style="margin: 0; padding: 0; border: none; background: transparent;">
            <input type="password" id="sitePassword" placeholder="Wpisz hasło admina" required style="padding: 5px; border: 1px solid #ccc; border-radius: 4px;">
            <button type="submit" style="padding: 5px 15px; margin: 0 5px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer;">Odblokuj zapis</button>
        </form>
        <span id="loginError" style="color: red; font-weight: bold; font-family: monospace; font-size: 12px;"></span>
    </div>

    <!-- 🌐 SEKCJA PUBLICZNA (WIDOCZNA DLA KAŻDEGO OD RAZU) -->
    <h1>🎮 Publiczna Przeglądarka Gier NKMM</h1>
    
    <div class="user-selector">
        <label>Wybierz profil do podejrzenia biblioteki:</label>
        <select id="userSelect">
            <option value="Baza gier MM">MM (Matthew)</option>
            <option value="Baza gier NK">NK (Przyjaciel)</option>
        </select>
    </div>

    <hr>

    <h2>1. Pobieranie i Wyświetlanie Zbiorów</h2>
    <button id="btnFetchGames">Pobierz Wszystkie Gry</button>
    
    <div id="outputConsole" class="console">Konsola testowa: oczekiwanie na pobranie danych gier...</div>

    <!-- 🛠️ STREFA ADMINISTRATORA (UKRYTA DLA ZWYKŁYCH GOŚCI NA START) -->
    <div id="adminZone" style="display: none;">
        <hr style="border: 2px solid #2c3e50;">
        <h2 style="color: #c0392b;">🛠️ Narzędzia Panelu Administracyjnego</h2>
        
        <button id="btnFetchSettings">Pobierz Słowniki Ustawień</button>
        
        <h3>2. Dodaj / Edytuj Grę w Arkuszu</h3>
        <form id="gameForm">
            <input type="hidden" id="gameId">
            
            <label>Tytuł:</label>
            <input type="text" id="gameTitle" required><br>

            <label>Stan:</label>
            <input type="text" id="gameStatus" required><br>

            <label>Platforma:</label>
            <input type="text" id="gamePlatform"><br>

            <label>Ocena gry:</label>
            <input type="number" id="gameRating" step="0.1" min="0" max="10"><br>

            <label>Recenzja:</label>
            <textarea id="gameReview"></textarea><br>

            <label>Kolekcje / Tagi:</label>
            <input type="text" id="gameCollections"><br>

            <button type="submit" id="btnSubmitGame">Zapisz Grę (Modyfikacja w chmurze)</button>
            <button type="button" id="btnResetForm" style="display:none;">Anuluj Edycję</button>
        </form>

        <hr>

        <h3>3. Szybkie Zarządzanie Słownikami</h3>
        <div class="settings-test">
            <select id="settingsColumn">
                <option value="Stan">Stan</option>
                <option value="Kolekcje">Kolekcje</option>
                <option value="Platformy">Platformy</option>
            </select>
            <input type="text" id="settingsValue" placeholder="Wartość">
            <button id="btnAddSetting">Dodaj do słownika</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
